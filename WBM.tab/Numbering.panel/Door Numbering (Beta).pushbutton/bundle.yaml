title: 'Door Numbering (Beta)'
tooltip: >
  Renseigne le parametre "Mark" des portes de la vue active selon la
  convention WBM : "{Prefixe}.{Niveau}.{NNN}".

  L'ordre suit le Number des pieces liees via FromRoom. Les portes
  partageant une meme piece, ou sans FromRoom (portes exterieures),
  sont departagees par position geometrique (sens horaire) par
  rapport a un repere d'entree (annotation type "M360_Entry").

  Version beta : une fenetre de previsualisation permet de verifier
  l'ordre propose avant de valider, en particulier sur les pieces
  ayant plusieurs portes.
author: WBM
